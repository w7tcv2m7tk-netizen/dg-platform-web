name: Checkout release verification
on:
  pull_request:
    paths:
      - '.github/workflows/checkout-release.yml'
      - 'packages/database/**'
      - 'packages/platform-core/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checkout-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run test:checkout-release
      - run: npm run test:security-certification
      - name: Install isolated PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-server-dev-16
      - name: Disposable PostgreSQL checkout, reconciliation and concurrency
        run: |
          PG_BIN="/usr/lib/postgresql/16/bin"
          node scripts/run-checkout-coordinator-db-tests.mjs "$PG_BIN"
          node scripts/run-checkout-compatibility-db-tests.mjs "$PG_BIN"
          node scripts/run-checkout-compatibility-db-tests.mjs "$PG_BIN" permissions
          node scripts/test-runtime-identity-db.mjs "$PG_BIN"
          node scripts/run-runtime-identity-control-db-tests.mjs "$PG_BIN"
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:checkout-compatibility-artifacts && npm run test:checkout-client-boundary
      - run: git diff --exit-code -- package-lock.json packages/database/prisma
      - run: git diff --check
