name: Final Security Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical unit suite
        run: npm run test:unit

      - name: Residual authority and isolation regressions
        run: >-
          node --experimental-strip-types --import ./scripts/register-ts-resolver.mjs --test
          scripts/test-feature-tail-authority.mjs
          scripts/test-residual-relationship-isolation.mjs
          scripts/test-review-request-contact-isolation.mjs
          scripts/test-notification-recipient-isolation.mjs
