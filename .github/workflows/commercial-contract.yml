name: Read-only commercial reconciliation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify detector with in-memory discrepancies
        run: npm run test:commercial-contract-safeguard
      - name: Reconcile current repository (fails on unresolved discrepancies)
        run: npm run test:commercial-contract
