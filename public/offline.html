<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Offline — DigitalGate</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #e2e8f0;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        padding: 2rem;
        border: 1px solid #1e293b;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.6);
        text-align: center;
      }
      img {
        width: 3rem;
        height: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 700;
        color: #fff;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #94a3b8;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        background: #10b981;
        color: #020617;
      }
      button:hover {
        background: #34d399;
      }
      .status {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand/icon-light.png" alt="DigitalGate" width="48" height="48" />
      <h1>You&rsquo;re offline</h1>
      <p>
        DigitalGate needs a connection for live data. Check your network, then reload to
        continue where you left off.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="status" id="status"></p>
    </div>
    <script>
      function updateStatus() {
        var el = document.getElementById("status");
        if (!el) return;
        el.textContent = navigator.onLine ? "Connection restored — tap Try again" : "Waiting for network…";
      }
      window.addEventListener("online", updateStatus);
      window.addEventListener("offline", updateStatus);
      updateStatus();
    </script>
  </body>
</html>
